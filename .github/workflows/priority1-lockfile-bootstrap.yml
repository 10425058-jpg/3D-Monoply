name: Refresh patched backend lockfile (temporary)

on:
  push:
    branches: [security/priority1-prod-hardening]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update lockfile for patched nested dependencies
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit lockfile only
        run: |
          git add backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): lock patched multer and body-parser production dependencies"
          git push origin HEAD:security/priority1-prod-hardening
