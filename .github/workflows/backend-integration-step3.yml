name: Backend integration tests (step 3)

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-integration-step3.yml'

permissions:
  contents: read

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monopoly
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: monopoly_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monopoly -d monopoly_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://monopoly:change-me@localhost:5432/monopoly_dev?schema=public
      JWT_ACCESS_SECRET: integration-tests-only-not-for-production-a-secret-1234567890
      CORS_ORIGIN: http://localhost:5173
      COOKIE_SECURE: 'false'
      DISCONNECT_GRACE_SECONDS: '2'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Apply committed migrations
        run: npx prisma migrate deploy
      - name: Type-check backend
        run: npm run lint
      - name: Test pure rules engine
        run: npm test
      - name: Build production backend
        run: npm run build
      - name: Start backend and await database health
        shell: bash
        run: |
          (npm run start:prod > /tmp/monopoly-step3.log 2>&1 &)
          for i in {1..45}; do
            if curl --fail --silent http://localhost:3000/api/v1/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          cat /tmp/monopoly-step3.log
          exit 1
      - name: Run live HTTP and Socket.IO integration tests
        run: npm run test:integration
      - name: Print backend server log on test failure
        if: failure()
        run: cat /tmp/monopoly-step3.log || true
