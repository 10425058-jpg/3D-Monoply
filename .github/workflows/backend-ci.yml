name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend / PostgreSQL / Socket.IO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monopoly
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: monopoly_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monopoly -d monopoly_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://monopoly:change-me@localhost:5432/monopoly_dev?schema=public
      JWT_ACCESS_SECRET: backend-ci-test-only-secret-never-production-1234567890
      CORS_ORIGIN: http://localhost:5173
      COOKIE_SECURE: 'false'
      DISCONNECT_GRACE_SECONDS: '2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install exact dependency versions
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply committed migrations
        run: npx prisma migrate deploy

      - name: Check migrations are up to date
        run: npx prisma migrate status

      - name: Check for schema drift
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Check gameplay database constraints
        run: |
          node -e '
          const { PrismaClient } = require("@prisma/client");
          (async () => {
            const db = new PrismaClient();
            try {
              const tables = await db.$queryRawUnsafe("SELECT tablename FROM pg_tables WHERE schemaname = '\''public'\''");
              const existing = new Set(tables.map(x => x.tablename));
              const expected = ["users", "user_sessions", "rooms", "room_members", "matches", "match_players", "property_ownerships", "match_decks", "processed_actions", "game_events"];
              for (const name of expected) if (!existing.has(name)) throw Error("Missing table: " + name);
              const rows = await db.$queryRawUnsafe("SELECT conname FROM pg_constraint WHERE contype = '\''c'\''");
              const actual = new Set(rows.map(row => row.conname));
              const checks = ["rooms_max_players_check", "room_members_seat_order_check", "match_players_position_check", "match_players_money_check", "property_ownerships_houses_check", "property_ownerships_is_mortgaged_check"];
              for (const name of checks) if (!actual.has(name)) throw Error("Missing CHECK: " + name);
              console.log("Verified ten application tables and six CHECK constraints");
            } finally {
              await db.$disconnect();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          '

      - name: Verify migrations are repeatable
        run: npx prisma migrate deploy

      - name: Type-check TypeScript
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build NestJS
        run: npm run build

      - name: Start backend
        shell: bash
        run: |
          npm run start:prod > /tmp/backend-ci-server.log 2>&1 &
          echo $! > /tmp/backend-ci-server.pid
          for i in {1..45}; do
            if curl -fsS http://localhost:3000/api/v1/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/backend-ci-server.log
          exit 1

      - name: REST smoke tests
        run: npm run smoke

      - name: HTTP and Socket.IO integration tests
        run: npm run test:integration

      - name: Print server output if failed
        if: failure()
        run: cat /tmp/backend-ci-server.log || true
