name: Verify baseline Prisma migration (step 2)

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/prisma/**'
      - '.github/workflows/backend-migrations-step2.yml'

permissions:
  contents: read

jobs:
  migrate-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monopoly
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: monopoly_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monopoly -d monopoly_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://monopoly:change-me@localhost:5432/monopoly_dev?schema=public
      JWT_ACCESS_SECRET: step2-testing-only-secret-never-use-for-production-123456789
      CORS_ORIGIN: http://localhost:5173
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend packages
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations to a fresh PostgreSQL database
        run: npx prisma migrate deploy
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Check schema drift against Prisma model
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Verify application tables and CHECK constraints
        run: |
          node -e '
          const { PrismaClient } = require("@prisma/client");
          (async () => {
            const db = new PrismaClient();
            try {
              const tables = await db.$queryRawUnsafe("SELECT tablename FROM pg_tables WHERE schemaname = '\''public'\''");
              const existing = new Set(tables.map(x => x.tablename));
              const expected = ["users","user_sessions","rooms","room_members","matches","match_players","property_ownerships","match_decks","processed_actions","game_events"];
              for (const name of expected) if (!existing.has(name)) throw Error("Missing table: " + name);
              const constraints = await db.$queryRawUnsafe("SELECT conname FROM pg_constraint WHERE contype = '\''c'\'' AND conname LIKE '\''%_check'\''");
              const checks = new Set(constraints.map(x => x.conname));
              for (const name of ["rooms_max_players_check","room_members_seat_order_check","match_players_position_check","match_players_money_check","property_ownerships_houses_check","property_ownerships_is_mortgaged_check"]) {
                if (!checks.has(name)) throw Error("Missing CHECK constraint: " + name);
              }
              console.log("PASS: all ten tables and six game CHECK constraints");
            } finally { await db.$disconnect(); }
          })().catch(e => { console.error(e); process.exitCode = 1; });
          '
      - name: Idempotent migration redeploy
        run: npx prisma migrate deploy
      - name: Type-check and build backend
        run: npm run lint && npm run build
      - name: Start server and verify health
        run: |
          (npm run start:prod > /tmp/monopoly-migration-step2.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/v1/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/monopoly-migration-step2.log
          exit 1
      - name: REST smoke test
        run: npm run smoke
      - name: Server log on failure
        if: failure()
        run: cat /tmp/monopoly-migration-step2.log || true
