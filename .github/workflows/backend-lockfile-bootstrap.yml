name: Generate backend dependency lockfile (step 4)

on:
  push:
    branches:
      - ci/step4-unified-backend

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate backend package-lock.json from registry
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Save generated lockfile to the test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(backend): lock dependency versions"
            git push
          fi
